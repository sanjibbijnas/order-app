<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order – Dairy Milk Parlour</title>
<style>
:root{--bg:#fdf6ea;--card:#fff;--ink:#35261a;--mute:#8d7b68;--brand:#c2410c;--brand2:#f59e0b;--ok:#16a34a;--line:#f1e4cf;--soft:#fff3df;--shadow:0 6px 20px rgba(120,70,20,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1611;--card:#27201a;--ink:#f6ead8;--mute:#b8a68f;--line:#3b3025;--soft:#33291f;--shadow:0 6px 20px rgba(0,0,0,.35)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,"Noto Sans Bengali","Nirmala UI",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:130px}
.hero{position:relative;background:linear-gradient(135deg,#9a3412 0%,#c2410c 45%,#f59e0b 100%);color:#fff;padding:calc(26px + env(safe-area-inset-top,0px)) 18px 46px;text-align:center;border-radius:0 0 32px 32px;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.10)}
.hero:before{width:180px;height:180px;right:-50px;top:-60px}.hero:after{width:120px;height:120px;left:-40px;bottom:-50px}
.hero .logo{font-size:42px;line-height:1}
.hero h1{font-size:23px;margin-top:6px;letter-spacing:.6px;position:relative}
.hero p{font-size:13px;opacity:.93;margin-top:4px;position:relative}
.pill{display:inline-block;margin-top:10px;background:rgba(255,255,255,.2);padding:6px 14px;border-radius:20px;font-size:12.5px;position:relative}
.wrap{max-width:640px;margin:-26px auto 0;padding:0 14px;position:relative}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 16px;border-radius:22px;border:none;background:var(--card);color:var(--ink);font-size:14px;cursor:pointer;box-shadow:var(--shadow)}
.tab.on{background:var(--brand);color:#fff}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.item.off{opacity:.5}
.emo{font-size:30px;width:54px;height:54px;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.info{flex:1;min-width:0}
.name{font-weight:bold;font-size:15px}
.price{color:var(--brand);font-size:14px;font-weight:bold;margin-top:3px}
.price small{color:var(--mute);font-weight:normal}
.qty{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:24px;padding:3px}
.qty button{width:34px;height:34px;border-radius:50%;border:none;font-size:20px;background:var(--brand);color:#fff;cursor:pointer}
.qty button.minus{background:var(--card);color:var(--ink)}
.qty span{min-width:32px;text-align:center;font-weight:bold;font-size:15px}
.tag{font-size:12px;background:#fee2e2;color:#991b1b;padding:5px 10px;border-radius:12px}
.card{background:var(--card);border-radius:18px;padding:15px;margin:14px 0;box-shadow:var(--shadow)}
.card h3{font-size:15px;margin-bottom:10px}
input,textarea,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;margin-bottom:8px;background:var(--bg);color:var(--ink);font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand)}
.row{display:flex;gap:8px;margin-bottom:8px}
.opt{flex:1;text-align:center;padding:12px 6px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:14px}
.opt input{display:none}
.opt:has(input:checked){border-color:var(--brand);background:var(--soft);font-weight:bold;color:var(--brand)}
.line{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.total{display:flex;justify-content:space-between;font-size:19px;font-weight:bold;padding-top:10px;color:var(--brand)}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:10px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.10);z-index:5;border-radius:20px 20px 0 0}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;font-size:13px;color:var(--mute)}
.bar .sum b{display:block;font-size:21px;color:var(--ink)}
.wa{background:var(--ok);color:#fff;border:none;border-radius:16px;padding:15px 18px;font-size:16px;font-weight:bold;cursor:pointer}
.wa:disabled{opacity:.4}
.foot{display:flex;justify-content:center;gap:18px;margin:8px 0 14px}
.link{background:none;border:none;color:var(--brand);font-size:14px;cursor:pointer;padding:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.on{display:flex}
.box{background:var(--card);border-radius:22px;padding:20px;max-width:360px;width:100%;text-align:center;max-height:92vh;overflow:auto}
.box button.b{width:100%;padding:13px;border-radius:14px;border:none;font-size:15px;margin-top:8px;cursor:pointer}
.b1{background:var(--ok);color:#fff}.b2{background:var(--line);color:var(--ink)}.b3{background:var(--brand);color:#fff}.b4{background:#dc2626;color:#fff}
#qr{display:flex;justify-content:center;margin:14px 0;background:#fff;padding:12px;border-radius:14px}
.url{font-size:12px;color:var(--mute);word-break:break-all}
/* admin */
.admin{position:fixed;inset:0;background:var(--bg);z-index:15;display:none;flex-direction:column}
.admin.on{display:flex}
.ahead{background:linear-gradient(135deg,#1f2937,#374151);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;justify-content:space-between;align-items:center}
.ahead h2{font-size:17px}
.ahead button{background:rgba(255,255,255,.18);border:none;color:#fff;padding:8px 14px;border-radius:12px;cursor:pointer;font-size:14px}
.atabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--card)}
.abody{flex:1;overflow:auto;padding:14px;max-width:640px;width:100%;margin:0 auto}
.arow{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:10px;margin-bottom:8px;box-shadow:var(--shadow)}
.arow .emo{width:42px;height:42px;font-size:22px;border-radius:12px}
.arow .pr{width:86px;margin:0;padding:8px;text-align:right}
.mini{border:none;background:var(--soft);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:14px}
.mini.red{background:#fee2e2;color:#991b1b}
label.f{display:block;text-align:left;font-size:13px;color:var(--mute);margin:6px 0 4px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;text-align:left}
.sw input{width:22px;height:22px;margin:0;accent-color:var(--brand)}
.note{font-size:13px;color:var(--mute);line-height:1.6;background:var(--soft);padding:12px;border-radius:12px;margin:10px 0;text-align:left}
.cat{font-size:12px;color:var(--mute)}
</style>
</head>
<body>

<div class="hero">
  <div class="logo">🥛</div>
  <h1 id="hName"></h1>
  <p id="hAddr"></p>
  <span class="pill">ঘৰতে বহি order দিয়ক · WhatsApp ত পাঠাওক</span>
</div>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>

  <div class="card"><h3>🧾 আপোনাৰ order</h3><div id="summary"></div></div>

  <div class="card" id="infoCard">
    <h3>👤 আপোনাৰ তথ্য</h3>
    <input id="cname" placeholder="নাম">
    <input id="cphone" type="tel" placeholder="ফোন নম্বৰ">
    <div class="row" id="modeRow"></div>
    <textarea id="caddr" rows="2" placeholder="ঠিকনা (Delivery ৰ বাবে)"></textarea>
    <textarea id="cnote" rows="2" placeholder="অন্য কিবা কব লগীয়া থাকিলে (ঐচ্ছিক)"></textarea>
  </div>

  <div class="foot">
    <button class="link" onclick="openShare()">📲 Share / QR</button>
    <button class="link" onclick="askPin()">🔒 Owner</button>
  </div>
</div>

<div class="bar"><div class="in">
  <div class="sum"><span id="cnt"></span><b id="tot"></b></div>
  <button class="wa" id="orderBtn" disabled onclick="placeOrder()">WhatsApp ত Order দিয়ক</button>
</div></div>

<!-- Share modal -->
<div class="ov" id="shareOv"><div class="box">
  <h3>📲 App share কৰক</h3>
  <p style="font-size:13px;margin-top:6px;color:var(--mute)">Customer য়ে QR scan কৰিলেই app খুলিব</p>
  <div id="qr"></div><div class="url" id="url"></div>
  <button class="b b1" onclick="waShare()">WhatsApp ত link পঠাওক</button>
  <button class="b b2" id="copyBtn" onclick="copyLink()">Link copy কৰক</button>
  <button class="b b2" onclick="closeOv('shareOv')">বন্ধ কৰক</button>
</div></div>

<!-- PIN modal -->
<div class="ov" id="pinOv"><div class="box">
  <h3>🔒 Owner login</h3>
  <p style="font-size:13px;color:var(--mute);margin:6px 0 10px">PIN দিয়ক</p>
  <input id="pinIn" type="password" inputmode="numeric" placeholder="PIN" style="text-align:center;font-size:20px">
  <button class="b b3" onclick="checkPin()">Login</button>
  <button class="b b2" onclick="closeOv('pinOv')">বাতিল</button>
</div></div>

<!-- Item edit modal -->
<div class="ov" id="itemOv" style="z-index:30"><div class="box" style="text-align:left">
  <h3 id="itemTitle">নতুন item</h3>
  <label class="f">Emoji</label><input id="fEmo" maxlength="4" placeholder="🥛">
  <label class="f">নাম</label><input id="fName" placeholder="যেনে: গৰুৰ দুধ">
  <label class="f">Category</label><input id="fCat" list="catList" placeholder="যেনে: দুধ"><datalist id="catList"></datalist>
  <label class="f">দাম (₹)</label><input id="fPrice" type="number" inputmode="decimal" min="0">
  <label class="f">একক (unit)</label><input id="fUnit" placeholder="লিটাৰ / কেজি / packet / পিচ">
  <label class="f">এবাৰত কিমান বাঢ়িব</label>
  <select id="fStep"><option value="0.25">0.25</option><option value="0.5">0.5</option><option value="1" selected>1</option></select>
  <div class="sw"><span>পোৱা যায় (Available)</span><input type="checkbox" id="fOn" checked></div>
  <button class="b b3" style="width:100%;padding:13px;border:none;border-radius:14px;margin-top:10px;font-size:15px;cursor:pointer" onclick="saveItem()">Save</button>
  <button class="b b2" style="width:100%;padding:13px;border:none;border-radius:14px;margin-top:8px;font-size:15px;cursor:pointer" onclick="closeOv('itemOv')">বাতিল</button>
</div></div>

<!-- Admin -->
<div class="admin" id="admin">
  <div class="ahead"><h2>⚙️ Owner Panel</h2><button onclick="closeAdmin()">✕ বন্ধ</button></div>
  <div class="atabs" id="atabs"></div>
  <div class="abody" id="abody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===== Default settings (settings.json ৰ পৰা বা Owner Panel ৰ পৰা সলনি হয়) ===== */
const DEFAULTS = {
  shop:{name:"DAIRY MILK PARLOUR",address:"Nera Municipal Office, Dergaon",phone:"91XXXXXXXXXX",currency:"₹"},
  delivery:{homeOn:true,pickupOn:true,charge:20,freeAbove:0},
  pin:"1234",
  products:[
    {id:"p1",cat:"দুধ",emo:"🥛",name:"গৰুৰ দুধ",price:60,unit:"লিটাৰ",step:0.5,on:true},
    {id:"p2",cat:"দুধ",emo:"🥛",name:"Packet দুধ (500ml)",price:30,unit:"packet",step:1,on:true},
    {id:"p3",cat:"দুগ্ধজাত",emo:"🍶",name:"দৈ",price:80,unit:"কেজি",step:0.5,on:true},
    {id:"p4",cat:"দুগ্ধজাত",emo:"🧈",name:"ঘিউ",price:700,unit:"কেজি",step:0.25,on:true},
    {id:"p5",cat:"দুগ্ধজাত",emo:"🧀",name:"পনীৰ",price:360,unit:"কেজি",step:0.25,on:true},
    {id:"p6",cat:"দুগ্ধজাত",emo:"🥣",name:"লচ্ছি",price:30,unit:"glass",step:1,on:true},
    {id:"p7",cat:"মিঠাই",emo:"🍮",name:"ৰসগোল্লা",price:20,unit:"পিচ",step:1,on:true},
    {id:"p8",cat:"মিঠাই",emo:"🍬",name:"পেঁড়া",price:480,unit:"কেজি",step:0.25,on:true}
  ]
};
const LS="dmp_settings_v2", LC="dmp_cust_v2";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(Math.round(n*100)/100).toString();
let S=JSON.parse(JSON.stringify(DEFAULTS)), cart={}, activeCat="সকলো", editId=null, aTab="items";
const cur=()=>S.shop.currency||"₹", money=n=>cur()+fmt(n);

function merge(o){ // বাহিৰৰ settings ক default ৰ সৈতে মিলাওক
  if(!o||typeof o!=="object")return;
  if(o.shop)S.shop=Object.assign({},S.shop,o.shop);
  if(o.delivery)S.delivery=Object.assign({},S.delivery,o.delivery);
  if(o.pin)S.pin=String(o.pin);
  if(Array.isArray(o.products))S.products=o.products;
}
function persist(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||"null");if(d)merge(d);return !!d;}catch(e){return false;}}

async function boot(){
  try{const r=await fetch("settings.json?v="+Date.now(),{cache:"no-store"});if(r.ok)merge(await r.json());}catch(e){}
  loadLocal(); loadCust(); renderAll();
}

/* ===== Customer view ===== */
function modes(){const m=[];if(S.delivery.homeOn)m.push("Home Delivery");if(S.delivery.pickupOn)m.push("Shop Pickup");return m;}
function curMode(){const r=document.querySelector('input[name="mode"]:checked');return r?r.value:(modes()[0]||"");}
function deliveryFee(sub){
  if(curMode()!=="Home Delivery")return 0;
  const c=+S.delivery.charge||0, fa=+S.delivery.freeAbove||0;
  return (fa>0&&sub>=fa)?0:c;
}
function renderAll(){
  $("hName").textContent=S.shop.name; $("hAddr").textContent=S.shop.address;
  document.title="Order – "+S.shop.name;
  renderTabs(); renderList(); renderModes(); update();
}
function renderTabs(){
  const cats=["সকলো",...new Set(S.products.map(p=>p.cat).filter(Boolean))];
  if(!cats.includes(activeCat))activeCat="সকলো";
  $("tabs").innerHTML=cats.map(c=>`<button class="tab ${c===activeCat?"on":""}" onclick="setCat(this.dataset.c)" data-c="${esc(c)}">${esc(c)}</button>`).join("");
}
function setCat(c){activeCat=c;renderTabs();renderList();}
function renderList(){
  const items=S.products.filter(p=>activeCat==="সকলো"||p.cat===activeCat);
  $("list").innerHTML=items.length?items.map(p=>`
   <div class="item ${p.on?"":"off"}">
     <div class="emo">${esc(p.emo||"🛒")}</div>
     <div class="info"><div class="name">${esc(p.name)}</div><div class="price">${money(p.price)} <small>/ ${esc(p.unit)}</small></div></div>
     ${p.on?`<div class="qty"><button class="minus" onclick="chg('${p.id}',-1)">−</button><span id="q_${p.id}">${fmt(cart[p.id]||0)}</span><button onclick="chg('${p.id}',1)">+</button></div>`:`<span class="tag">স্টক নাই</span>`}
   </div>`).join(""):`<div class="empty">কোনো item নাই</div>`;
}
function renderModes(){
  const m=modes(), keep=curMode();
  const ic=$("infoCard");
  $("modeRow").style.display=m.length?"flex":"none";
  $("caddr").style.display=m.includes("Home Delivery")?"block":"none";
  $("modeRow").innerHTML=m.map((v,i)=>`<label class="opt"><input type="radio" name="mode" value="${v}" ${(v===keep||(!m.includes(keep)&&i===0))?"checked":""} onchange="update()">${v==="Home Delivery"?"🛵 Home Delivery":"🏪 Shop Pickup"}</label>`).join("");
  toggleAddr();
}
function toggleAddr(){ $("caddr").style.display=(S.delivery.homeOn&&curMode()==="Home Delivery")?"block":"none"; }
function chg(id,d){
  const p=S.products.find(x=>x.id===id); if(!p)return;
  let q=Math.max(0,Math.round(((cart[id]||0)+d*(+p.step||1))*100)/100);
  if(q===0)delete cart[id];else cart[id]=q;
  const el=$("q_"+id); if(el)el.textContent=fmt(q);
  update();
}
function calc(){
  let sub=0; const rows=[];
  Object.keys(cart).forEach(id=>{
    const p=S.products.find(x=>x.id===id);
    if(!p||!p.on){delete cart[id];return;}
    const a=p.price*cart[id]; sub+=a; rows.push({p,q:cart[id],a});
  });
  const fee=deliveryFee(sub);
  return {rows,sub,fee,total:sub+fee};
}
function update(){
  toggleAddr();
  const c=calc();
  $("summary").innerHTML=c.rows.length?c.rows.map(r=>`<div class="line"><span>${esc(r.p.name)} × ${fmt(r.q)} ${esc(r.p.unit)}</span><span>${money(r.a)}</span></div>`).join("")
    +(curMode()==="Home Delivery"&&(+S.delivery.charge>0)?`<div class="line"><span>🛵 Delivery charge${c.fee===0?" (Free)":""}</span><span>${money(c.fee)}</span></div>`:"")
    +`<div class="total"><span>মুঠ (Total)</span><span>${money(c.total)}</span></div>`
    :`<div class="empty">এতিয়াও কোনো বস্তু বাছনি কৰা হোৱা নাই</div>`;
  $("cnt").textContent=c.rows.length+" টা বস্তু";
  $("tot").textContent=money(c.total);
  $("orderBtn").disabled=!c.rows.length;
}
function placeOrder(){
  const ph=String(S.shop.phone||"").replace(/\D/g,"");
  if(!ph||S.shop.phone.includes("X")){alert("Shop ৰ WhatsApp নম্বৰ এতিয়াও set কৰা হোৱা নাই।");return;}
  if(!$("cname").value.trim()){alert("অনুগ্ৰহ কৰি আপোনাৰ নাম লিখক");$("cname").focus();return;}
  const mode=curMode();
  if(mode==="Home Delivery"&&!$("caddr").value.trim()){alert("Home Delivery ৰ বাবে ঠিকনা লিখক");$("caddr").focus();return;}
  saveCust();
  const c=calc(); let m=`*নতুন Order – ${S.shop.name}*\n\n`;
  c.rows.forEach((r,i)=>{m+=`${i+1}. ${r.p.name} – ${fmt(r.q)} ${r.p.unit} × ${money(r.p.price)} = ${money(r.a)}\n`;});
  m+=`\nItem মুঠ: ${money(c.sub)}\n`;
  if(mode==="Home Delivery")m+=`Delivery charge: ${money(c.fee)}\n`;
  m+=`*সর্বমুঠ: ${money(c.total)}*\n\nনাম: ${$("cname").value.trim()}\nফোন: ${$("cphone").value.trim()||"-"}\n`;
  if(mode)m+=`ধৰণ: ${mode}\n`;
  if(mode==="Home Delivery")m+=`ঠিকনা: ${$("caddr").value.trim()}\n`;
  if($("cnote").value.trim())m+=`Note: ${$("cnote").value.trim()}\n`;
  window.open("https://wa.me/"+ph+"?text="+encodeURIComponent(m),"_blank");
}
function saveCust(){try{localStorage.setItem(LC,JSON.stringify({n:$("cname").value,p:$("cphone").value,a:$("caddr").value}));}catch(e){}}
function loadCust(){try{const d=JSON.parse(localStorage.getItem(LC)||"null");if(d){$("cname").value=d.n||"";$("cphone").value=d.p||"";$("caddr").value=d.a||"";}}catch(e){}}

/* ===== Share ===== */
const pageUrl=()=>location.href.split("#")[0].split("?")[0];
function openShare(){
  $("shareOv").classList.add("on");$("url").textContent=pageUrl();$("qr").innerHTML="";$("copyBtn").textContent="Link copy কৰক";
  if(window.QRCode)new QRCode($("qr"),{text:pageUrl(),width:200,height:200});else $("qr").textContent="QR বনাবলৈ internet লাগিব";
}
function closeOv(id){$(id).classList.remove("on");}
function waShare(){window.open("https://wa.me/?text="+encodeURIComponent(S.shop.name+" – ঘৰতে বহি order দিয়ক 👇\n"+pageUrl()),"_blank");}
async function copyLink(){try{await navigator.clipboard.writeText(pageUrl());$("copyBtn").textContent="✅ Copy হ'ল";}catch(e){prompt("Link copy কৰক:",pageUrl());}}
document.querySelectorAll(".ov").forEach(o=>o.addEventListener("click",e=>{if(e.target===o&&o.id!=="itemOv")o.classList.remove("on");}));

/* ===== Owner ===== */
function askPin(){$("pinIn").value="";$("pinOv").classList.add("on");setTimeout(()=>$("pinIn").focus(),100);}
function checkPin(){
  if($("pinIn").value===String(S.pin)){closeOv("pinOv");openAdmin();}
  else{alert("PIN ভুল");$("pinIn").value="";}
}
function openAdmin(){$("admin").classList.add("on");renderAdmin();}
function closeAdmin(){$("admin").classList.remove("on");renderAll();}
function setATab(t){aTab=t;renderAdmin();}
function touch(){persist();renderAll();}

function renderAdmin(){
  const tabs=[["items","📦 Items"],["delivery","🛵 Delivery"],["shop","🏪 Shop"],["publish","🚀 Publish"]];
  $("atabs").innerHTML=tabs.map(([k,l])=>`<button class="tab ${aTab===k?"on":""}" onclick="setATab('${k}')">${l}</button>`).join("");
  const b=$("abody");
  if(aTab==="items"){
    b.innerHTML=`<button class="wa" style="width:100%;margin-bottom:12px" onclick="editItem(null)">➕ নতুন item যোগ কৰক</button>`+
     (S.products.map(p=>`
      <div class="arow">
        <div class="emo">${esc(p.emo||"🛒")}</div>
        <div class="info"><div class="name" style="font-size:14px">${esc(p.name)}</div><div class="cat">${esc(p.cat||"")} · ${esc(p.unit)} ${p.on?"":"· ❌ off"}</div></div>
        <input class="pr" type="number" inputmode="decimal" value="${p.price}" onchange="setPrice('${p.id}',this.value)">
        <button class="mini" onclick="editItem('${p.id}')">✏️</button>
        <button class="mini red" onclick="delItem('${p.id}')">🗑</button>
      </div>`).join("")||`<div class="empty">কোনো item নাই</div>`)+
     `<div class="note">দামৰ ঘৰত সোজাকৈ লিখি দাম সলাব পাৰে। ✏️ টিপি নাম, category, unit আদি সলাওক।</div>`;
  }else if(aTab==="delivery"){
    b.innerHTML=`<div class="card" style="margin-top:0">
      <div class="sw"><span>🛵 Home Delivery চলাওক</span><input type="checkbox" ${S.delivery.homeOn?"checked":""} onchange="S.delivery.homeOn=this.checked;touch();renderAdmin()"></div>
      <div class="sw"><span>🏪 Shop Pickup চলাওক</span><input type="checkbox" ${S.delivery.pickupOn?"checked":""} onchange="S.delivery.pickupOn=this.checked;touch();renderAdmin()"></div>
      ${S.delivery.homeOn?`<label class="f" style="margin-top:12px">Delivery charge (${esc(cur())}) – 0 দিলে free</label>
      <input type="number" inputmode="decimal" min="0" value="${S.delivery.charge}" onchange="S.delivery.charge=+this.value||0;touch()">
      <label class="f">এই টকাৰ ওপৰত order হ'লে Delivery free (${esc(cur())}) – 0 দিলে নাই</label>
      <input type="number" inputmode="decimal" min="0" value="${S.delivery.freeAbove}" onchange="S.delivery.freeAbove=+this.value||0;touch()">`:""}
      </div>
      <div class="note">দুয়োটা বন্ধ কৰিলে customer ক option নেদেখুৱায়, কেৱল order যায়।</div>`;
  }else if(aTab==="shop"){
    b.innerHTML=`<div class="card" style="margin-top:0">
      <label class="f">দোকানৰ নাম</label><input value="${esc(S.shop.name)}" onchange="S.shop.name=this.value;touch()">
      <label class="f">ঠিকনা</label><input value="${esc(S.shop.address)}" onchange="S.shop.address=this.value;touch()">
      <label class="f">WhatsApp নম্বৰ (91 সহ, + নালাগে)</label><input type="tel" value="${esc(S.shop.phone)}" onchange="S.shop.phone=this.value.replace(/[^0-9]/g,'');touch()">
      <label class="f">Currency চিন</label><input value="${esc(S.shop.currency)}" maxlength="3" onchange="S.shop.currency=this.value||'₹';touch()">
      <label class="f">Owner PIN (পাল্টাওক)</label><input type="text" inputmode="numeric" value="${esc(S.pin)}" onchange="if(this.value.length>=4){S.pin=this.value;touch();}else{alert('PIN কমেও ৪ আখৰৰ হ'+'ব লাগে');this.value=S.pin;}">
      </div>`;
  }else{
    b.innerHTML=`<div class="note"><b>⚠️ গুৰুত্বপূৰ্ণ:</b> আপুনি ইয়াত যিবোৰ সলনি কৰে সেয়া কেৱল <b>আপোনাৰ ফোনত</b> save হয়। Customer ৰ ফোনত দেখুৱাবলৈ তলৰ ধাপ অনুসৰণ কৰক।</div>
      <div class="card" style="margin-top:0">
        <h3>Customer লৈ update পঠোৱাৰ ধাপ</h3>
        <p class="note" style="margin:0 0 10px">১. তলৰ বুটাম টিপি <b>settings.json</b> download কৰক<br>২. GitHub ত আপোনাৰ repository খোলক<br>৩. Add file → Upload files ত এই <b>settings.json</b> দিয়ক (পুৰণিটোৰ ঠাইত নতুনটো বহিব)<br>৪. Commit কৰক। ১-২ মিনিটত customer সকলে নতুন item/দাম পাব</p>
        <button class="wa" style="width:100%" onclick="dlSettings()">⬇️ settings.json download কৰক</button>
      </div>
      <button class="wa" style="width:100%;background:var(--brand);margin-top:4px" onclick="closeAdmin();openShare()">📲 App link / QR share কৰক</button>
      <button class="wa" style="width:100%;background:#6b7280;margin-top:10px" onclick="resetLocal()">↺ ফোনৰ edit বোৰ আঁতৰাওক (Publish কৰা অৱস্থালৈ যাওক)</button>`;
  }
}
function setPrice(id,v){const p=S.products.find(x=>x.id===id);if(p){p.price=Math.max(0,+v||0);touch();}}
function delItem(id){const p=S.products.find(x=>x.id===id);if(p&&confirm(`"${p.name}" মচিবনে?`)){S.products=S.products.filter(x=>x.id!==id);delete cart[id];touch();renderAdmin();}}
function editItem(id){
  editId=id; const p=id?S.products.find(x=>x.id===id):null;
  $("itemTitle").textContent=p?"Item edit":"নতুন item";
  $("fEmo").value=p?p.emo:"🛒"; $("fName").value=p?p.name:""; $("fCat").value=p?p.cat:(activeCat!=="সকলো"?activeCat:"");
  $("fPrice").value=p?p.price:""; $("fUnit").value=p?p.unit:""; $("fStep").value=p?String(p.step):"1"; $("fOn").checked=p?p.on:true;
  $("catList").innerHTML=[...new Set(S.products.map(x=>x.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("");
  $("itemOv").classList.add("on");
}
function saveItem(){
  const name=$("fName").value.trim(); if(!name){alert("নাম লিখক");return;}
  const price=+$("fPrice").value; if(isNaN(price)||$("fPrice").value===""){alert("দাম লিখক");return;}
  const d={emo:$("fEmo").value.trim()||"🛒",name,cat:$("fCat").value.trim()||"অন্যান্য",price,unit:$("fUnit").value.trim()||"পিচ",step:+$("fStep").value||1,on:$("fOn").checked};
  if(editId){Object.assign(S.products.find(x=>x.id===editId),d);}
  else{S.products.push(Object.assign({id:"p"+Date.now()},d));}
  closeOv("itemOv"); touch(); renderAdmin();
}
function dlSettings(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="settings.json";
  document.body.appendChild(a);a.click();a.remove();
}
async function resetLocal(){
  if(!confirm("ফোনত কৰা edit বোৰ আঁতৰাব নেকি?"))return;
  try{localStorage.removeItem(LS);}catch(e){}
  S=JSON.parse(JSON.stringify(DEFAULTS));
  try{const r=await fetch("settings.json?v="+Date.now(),{cache:"no-store"});if(r.ok)merge(await r.json());}catch(e){}
  renderAll();renderAdmin();
}
boot();
</script>
</body>
</html>
